<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mana Gram Seva - Village Government Services</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4ecd8;--card:#fffaf0;--ink:#1f2a44;--mute:#5d5a4d;--rule:#d9cfb4;--stamp:#b3261e;--ok:#1d6b3a;--gold:#c9871a;--fs:16px;--disp:"Fraunces",Georgia,"Noto Sans Telugu",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171a24;--card:#20253a;--ink:#f1ead6;--mute:#b4ae98;--rule:#39405c;--stamp:#ff8a80;--ok:#7bdc9c;--gold:#f0b24a}}
:root[data-theme="dark"]{--paper:#171a24;--card:#20253a;--ink:#f1ead6;--mute:#b4ae98;--rule:#39405c;--stamp:#ff8a80;--ok:#7bdc9c;--gold:#f0b24a}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);background:var(--paper) repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--rule) 45%,transparent) 31px 32px);font:400 var(--fs)/1.6 "Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 48px}
.head{margin:18px 0 12px;padding:16px 16px 14px;background:var(--card);border:3px double var(--ink);position:relative}
.head .kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0}
h1{font:800 clamp(1.7rem,6vw,2.3rem)/1.05 var(--disp);margin:4px 0 6px}
.head p{margin:0;color:var(--mute);font-size:.9rem;max-width:30em}
.seal{position:absolute;right:12px;top:12px;transform:rotate(8deg);border:2.5px solid var(--stamp);color:var(--stamp);border-radius:50%;width:78px;height:78px;display:grid;place-items:center;text-align:center;font:800 .62rem/1.15 var(--disp);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input[type=search]{flex:1;min-width:170px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:2px;padding:9px 11px}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{border:2px solid var(--ink);background:var(--card);padding:6px 13px;font-size:.84rem;font-weight:700;border-radius:2px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.q{margin:14px 0 6px;font:600 1.05rem var(--disp)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .pill{border-radius:999px;border-style:dashed}.chips .pill[aria-pressed="true"]{border-style:solid}
.note{margin:14px 0;padding:10px 12px;border-left:6px solid var(--stamp);background:var(--card);font-size:.86rem}
.list{margin:16px 0 0;padding:0;list-style:none}
.file{--c:#999;margin:10px 0;background:var(--card);border:2px solid var(--ink);border-left:12px solid var(--c);box-shadow:4px 4px 0 var(--rule)}
.row{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:12px 12px 12px 10px}
.no{font:800 1.3rem var(--disp);color:var(--mute);min-width:2ch}
.row .ic{font-size:1.7rem}.row b{display:block;font:600 1.08rem/1.2 var(--disp)}.row small{display:block;color:var(--mute);font-size:.84rem;line-height:1.35;margin-top:2px}
.row .go{margin-left:auto;font-size:1.3rem;transition:transform .2s}.file.open .go{transform:rotate(90deg)}
.slip{display:none;border-top:2px dashed var(--ink);padding:14px 14px 16px;position:relative}
.file.open .slip{display:block}
.slip h4{margin:14px 0 6px;font:800 .72rem var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.slip h4:first-child{margin-top:0}
.slip p{margin:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.chk input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--ink);background:var(--paper);margin:1px 0 0;display:grid;place-content:center}
.chk input::after{content:"✓";font-weight:800;color:var(--ok);transform:scale(0);transition:transform .12s}
.chk input:checked::after{transform:scale(1.25)}
.chk input:checked+span{text-decoration:line-through;text-decoration-color:var(--ok);color:var(--mute)}
.prog{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.stamp{display:inline-block;transform:rotate(-5deg);border:3px solid var(--stamp);color:var(--stamp);padding:2px 12px;font:800 .95rem var(--disp);letter-spacing:.08em;text-transform:uppercase}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
.lk{display:inline-flex;gap:6px;align-items:center;margin:6px 8px 0 0;padding:9px 14px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;font-size:.88rem;border-radius:2px}
.clr{border:0;background:none;text-decoration:underline;color:var(--mute);font-size:.8rem;padding:0}
.ovr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding:10px 12px;background:var(--card);border:2px solid var(--ink)}
.dots{display:flex;gap:5px}.dots i{width:14px;height:14px;border:2px solid var(--ink);background:var(--paper)}.dots i.f{background:var(--ok);border-color:var(--ok)}
.office{margin-top:18px;padding:12px;background:var(--card);border:2px dashed var(--ink)}.office h3{margin:0 0 6px;font:600 1.02rem var(--disp)}
.office input[type=tel]{width:100%;max-width:260px;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:8px;margin:4px 8px 4px 0}
.lk.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.empty{padding:20px;text-align:center;border:2px dashed var(--ink);margin-top:14px;color:var(--mute)}
.foot{font-size:.78rem;color:var(--mute);margin-top:22px}
@media (max-width:540px){.head h1,.head p{padding-right:78px}.head .seal{width:66px;height:66px;font-size:.54rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
